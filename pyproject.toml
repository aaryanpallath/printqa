[project]
name = "printqa"
version = "0.1.0"
description = "Automated print-quality inspection: aligns scanned test charts with OpenCV and measures streaks, banding, missing nozzles, color registration and density against a spec, with a self-validating simulator and an HTML trend report"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9", "matplotlib>=3.8", "pyyaml>=6"]

[project.scripts]
printqa = "printqa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/printqa/report.py" = ["E501"]  # HTML template
"bench/validate.py" = ["E501"]
